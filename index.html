<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Retro Console - Hybrid</title>

    <!--
      PHASE 4 (L1): CSP tightened to the MAX.
      Now that the VT323 font is self-hosted (app.css @font-face + fonts/*.woff2),
      EVERYTHING is locked to 'self'. Zero external hosts remain:
        - no more https://fonts.googleapis.com (style-src)
        - no more https://fonts.gstatic.com (font-src)
      The app now makes ZERO outbound network requests.
    -->
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        script-src 'self';
        style-src 'self';
        font-src 'self';
        img-src 'self' data:;
        connect-src 'self';
        object-src 'none';
        base-uri 'none';
    ">

    <!-- Google Fonts <link> REMOVED. Font is now bundled locally via app.css @font-face. -->
    <link rel="stylesheet" href="app.css">
</head>

<body>

    <div id="crt-container">
        <canvas id="particle-canvas"></canvas>

        <div class="header-text">
            <div class="left-controls">
                <span class="title-text">RETRO CONSOLE // SYS.ADMIN</span>
                <span class="counter-box" id="refresh-counter">REFRESHES: 0</span>
                <span class="btn" id="btn-auto">[AUTO: ON]</span>
                <span class="btn" id="btn-refresh">[REFRESH NOW]</span>
            </div>
            <div class="window-controls controls">
                <span class="btn" id="btn-min">[-]</span>
                <span class="btn" id="btn-max">[â–¡]</span>
                <span class="btn btn-close" id="btn-close">[X]</span>
            </div>
        </div>

        <div id="terminal-content">
        </div>

        <div id="footer-section">
            <div class="progress-container">
                <div class="progress-bar-fill" id="prog-fill"></div>
            </div>
            <div class="status-line">
                <span id="status-text">SYSTEM STANDBY</span>
                <span id="time-text">--:--:--</span>
            </div>
        </div>
    </div>

    <!-- Loaded at end of body so all DOM elements exist before app.js runs -->
    <script src="app.js"></script>
</body>

</html>
