<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Retro Console - Hybrid</title>

    <!--
      PHASE 2 (H1): Content Security Policy.
      - script-src 'self'        -> only app.js, NO inline scripts / no unsafe-inline
      - style-src  'self' + fonts API  -> only app.css + the Google Fonts stylesheet
      - font-src   'self' + gstatic    -> actual VT323 font files (L1 will self-host later)
      - everything else locked to 'self' / blocked
      NOTE: this only works because all inline scripts/styles & onclick handlers were
      externalized into app.js / app.css with addEventListener.
    -->
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        script-src 'self';
        style-src 'self' https://fonts.googleapis.com;
        font-src 'self' https://fonts.gstatic.com;
        img-src 'self' data:;
        connect-src 'self';
        object-src 'none';
        base-uri 'none';
    ">

    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="app.css">
</head>

<body>

    <div id="crt-container">
        <canvas id="particle-canvas"></canvas>

        <div class="header-text">
            <div class="left-controls">
                <span class="title-text">RETRO CONSOLE // SYS.ADMIN</span>
                <span class="counter-box" id="refresh-counter">REFRESHES: 0</span>
                <span class="btn" id="btn-auto">[AUTO: ON]</span>
                <span class="btn" id="btn-refresh">[REFRESH NOW]</span>
            </div>
            <div class="window-controls controls">
                <span class="btn" id="btn-min">[-]</span>
                <span class="btn" id="btn-max">[▢]</span>
                <span class="btn btn-close" id="btn-close">[X]</span>
            </div>
        </div>

        <div id="terminal-content">
        </div>

        <div id="footer-section">
            <div class="progress-container">
                <div class="progress-bar-fill" id="prog-fill"></div>
            </div>
            <div class="status-line">
                <span id="status-text">SYSTEM STANDBY</span>
                <span id="time-text">--:--:--</span>
            </div>
        </div>
    </div>

    <!-- Loaded at end of body so all DOM elements exist before app.js runs -->
    <script src="app.js"></script>
